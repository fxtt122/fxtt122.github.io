<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>霓虹幻境 | 动态粒子网络 · 均匀粒子场</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', 'Montserrat', system-ui, -apple-system, 'Inter', sans-serif;
            background-color: #050510;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hero {
            position: absolute;
            z-index: 20;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            text-align: center;
            backdrop-filter: blur(2px);
        }

        .glass-card {
            background: rgba(10, 20, 40, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.2rem 2.8rem;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.05);
            animation: borderPulse 3s infinite ease-in-out;
            margin: 1rem;
        }

        h1 {
            font-size: clamp(2.2rem, 10vw, 5.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #aaffff, #ff66cc, #ffaa33);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(0,255,255,0.5);
            animation: textGlow 2.5s infinite alternate;
        }

        .sub {
            font-size: clamp(0.9rem, 4vw, 1.3rem);
            color: #ccf4ff;
            letter-spacing: 0.3em;
            margin-top: 0.5rem;
            font-weight: 300;
            text-transform: uppercase;
            background: linear-gradient(120deg, #e0f0ff, #aaccff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            opacity: 0.9;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(180, 220, 255, 0.6);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            width: fit-content;
            margin: 0 auto;
            padding: 6px 16px;
            border-radius: 30px;
            pointer-events: none;
            font-family: monospace;
            z-index: 20;
            letter-spacing: 1px;
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 5px cyan, 0 0 10px #ff66cc;
            }
            100% {
                text-shadow: 0 0 20px #0ff, 0 0 30px #f0f, 0 0 40px #ff66aa;
            }
        }

        @keyframes borderPulse {
            0% {
                border-color: rgba(0, 255, 255, 0.3);
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            }
            50% {
                border-color: rgba(255, 100, 200, 0.7);
                box-shadow: 0 0 40px rgba(255, 80, 180, 0.4);
            }
            100% {
                border-color: rgba(0, 255, 255, 0.3);
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            }
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 0.8rem 1.6rem;
            }
            .sub {
                letter-spacing: 0.2em;
            }
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="particleCanvas"></canvas>
</div>

<div class="hero">
    <div class="glass-card">
        <h1>✨ NEBULA FLOW ✨</h1>
        <div class="sub">Particle Network • 均衡粒子场</div>
    </div>
    <div class="info">
        🖱️ 鼠标移动 → 粒子流斥力场 | 粒子间互斥 | 中心引力 | 动态光网
    </div>
</div>

<script>
    (function(){
        // ---------- 粒子系统参数 ----------
        const PARTICLE_COUNT = 160;           // 粒子数量
        const CONNECT_DISTANCE = 115;         // 连线最大距离
        const MOUSE_REPEL_RADIUS = 130;       // 鼠标斥力半径
        const REPEL_FORCE = 0.75;             // 鼠标斥力强度
        const FRICTION = 0.985;               // 全局摩擦力
        
        // 新增: 粒子间斥力参数
        const INTER_REPULSION_RADIUS = 48;     // 粒子间斥力作用半径
        const INTER_REPULSION_STRENGTH = 0.42; // 斥力强度
        
        // 新增: 中心引力参数 (避免粒子聚集角落)
        const CENTER_ATTRACTION = 0.00085;     // 指向画面中心的引力系数
        
        // 布朗运动强度
        const BROWNIAN_FORCE = 0.18;
        
        let particles = [];
        let mouseX = null, mouseY = null;
        let mouseInside = false;
        let canvasWidth, canvasHeight;
        let animationId = null;
        
        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }
        
        class Particle {
            constructor(x, y, vx, vy, hue) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.hue = hue;
                this.radius = 2.8 + Math.random() * 2;
                this.saturation = 70 + Math.random() * 30;
                this.lightness = 60 + Math.random() * 30;
            }
            
            getColor() {
                return `hsl(${this.hue}, ${this.saturation}%, ${this.lightness}%)`;
            }
            
            // 边界处理 (弹性系数提高，减少能量损失)
            updateBounds(width, height) {
                if (this.x - this.radius <= 0) {
                    this.x = this.radius;
                    this.vx = -this.vx * 0.98;
                }
                if (this.x + this.radius >= width) {
                    this.x = width - this.radius;
                    this.vx = -this.vx * 0.98;
                }
                if (this.y - this.radius <= 0) {
                    this.y = this.radius;
                    this.vy = -this.vy * 0.98;
                }
                if (this.y + this.radius >= height) {
                    this.y = height - this.radius;
                    this.vy = -this.vy * 0.98;
                }
            }
            
            update(forceX, forceY, width, height) {
                this.vx += forceX;
                this.vy += forceY;
                
                // 布朗运动
                this.vx += (Math.random() - 0.5) * BROWNIAN_FORCE;
                this.vy += (Math.random() - 0.5) * BROWNIAN_FORCE;
                
                this.vx *= FRICTION;
                this.vy *= FRICTION;
                
                let maxSpeed = 6.5;
                if (Math.abs(this.vx) > maxSpeed) this.vx = this.vx > 0 ? maxSpeed : -maxSpeed;
                if (Math.abs(this.vy) > maxSpeed) this.vy = this.vy > 0 ? maxSpeed : -maxSpeed;
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.updateBounds(width, height);
            }
        }
        
        function initParticles(width, height) {
            const newParticles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const x = randomRange(40, width - 40);
                const y = randomRange(40, height - 40);
                const vx = randomRange(-1.0, 1.0);
                const vy = randomRange(-1.0, 1.0);
                const hue = (i * 360 / PARTICLE_COUNT + Math.random() * 30) % 360;
                newParticles.push(new Particle(x, y, vx, vy, hue));
            }
            return newParticles;
        }
        
        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            particles = initParticles(canvasWidth, canvasHeight);
        }
        
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                if (e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else return null;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            canvasX = Math.min(Math.max(0, canvasX), canvasWidth);
            canvasY = Math.min(Math.max(0, canvasY), canvasHeight);
            return { x: canvasX, y: canvasY };
        }
        
        function onMouseMove(e) {
            const coords = getCanvasCoords(e);
            if (coords) {
                mouseX = coords.x;
                mouseY = coords.y;
                mouseInside = true;
            }
        }
        
        function onMouseLeave() {
            mouseInside = false;
            mouseX = null;
            mouseY = null;
        }
        
        function onTouchMove(e) {
            e.preventDefault();
            const coords = getCanvasCoords(e);
            if (coords) {
                mouseX = coords.x;
                mouseY = coords.y;
                mouseInside = true;
            }
        }
        
        function onTouchEnd() {
            mouseInside = false;
            mouseX = null;
            mouseY = null;
        }
        
        // 鼠标斥力计算
        function computeMouseRepulsion(p, mx, my) {
            if (!mouseInside || mx === null || my === null) return { fx: 0, fy: 0 };
            const dx = p.x - mx;
            const dy = p.y - my;
            const distSq = dx * dx + dy * dy;
            const radiusSq = MOUSE_REPEL_RADIUS * MOUSE_REPEL_RADIUS;
            if (distSq < radiusSq && distSq > 0.01) {
                const dist = Math.sqrt(distSq);
                const force = (1 - dist / MOUSE_REPEL_RADIUS) * REPEL_FORCE;
                const dirX = dx / dist;
                const dirY = dy / dist;
                return { fx: dirX * force, fy: dirY * force };
            }
            return { fx: 0, fy: 0 };
        }
        
        // 绘制背景星空渐变
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
            grad.addColorStop(0, '#030318');
            grad.addColorStop(0.4, '#0a0a2a');
            grad.addColorStop(1, '#020210');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            ctx.fillStyle = 'rgba(255,255,240,0.08)';
            for (let i = 0; i < 120; i++) {
                const starX = (i * 131) % canvasWidth;
                const starY = (i * 253) % canvasHeight;
                ctx.beginPath();
                ctx.arc(starX, starY, 0.8 + (i%3)*0.4, 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        // 绘制粒子连线
        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < CONNECT_DISTANCE) {
                        const alpha = (1 - distance / CONNECT_DISTANCE) * 0.45;
                        const hue1 = p1.hue;
                        const hue2 = p2.hue;
                        let avgHue = (hue1 + hue2) / 2;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `hsla(${avgHue}, 75%, 65%, ${alpha})`;
                        ctx.lineWidth = 1.2 + (1 - distance / CONNECT_DISTANCE) * 0.8;
                        ctx.stroke();
                    }
                }
            }
        }
        
        function drawGlowBursts() {
            for (let p of particles) {
                if (Math.random() > 0.92) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${p.hue}, 80%, 70%, 0.2)`;
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 90%, 75%, 0.9)`;
                ctx.fill();
            }
        }
        
        function drawParticles() {
            for (let p of particles) {
                const radGrad = ctx.createRadialGradient(p.x - 1, p.y - 1, 1, p.x, p.y, p.radius + 1);
                radGrad.addColorStop(0, `hsl(${p.hue}, 90%, 80%)`);
                radGrad.addColorStop(1, `hsl(${p.hue}, 100%, 55%)`);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = radGrad;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x - 0.8, p.y - 0.8, p.radius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, 0.7)`;
                ctx.fill();
            }
        }
        
        function drawMouseGlow() {
            if (mouseInside && mouseX !== null && mouseY !== null && mouseX > 0 && mouseX < canvasWidth && mouseY > 0 && mouseY < canvasHeight) {
                const gradient = ctx.createRadialGradient(mouseX, mouseY, 8, mouseX, mouseY, MOUSE_REPEL_RADIUS * 0.9);
                gradient.addColorStop(0, 'rgba(0, 255, 255, 0.35)');
                gradient.addColorStop(0.4, 'rgba(255, 80, 200, 0.2)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, MOUSE_REPEL_RADIUS * 0.9, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, MOUSE_REPEL_RADIUS * 0.55, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 100, 180, 0.25)';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, MOUSE_REPEL_RADIUS * 0.7, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 210, 255, 0.6)';
                ctx.lineWidth = 1.8;
                ctx.stroke();
                ctx.globalCompositeOperation = 'source-over';
            } else {
                ctx.globalCompositeOperation = 'source-over';
            }
        }
        
        let starTrailTimer = 0;
        function drawMeteorDust() {
            starTrailTimer++;
            if (starTrailTimer % 8 === 0) {
                for (let s = 0; s < 3; s++) {
                    const randX = Math.random() * canvasWidth;
                    const randY = Math.random() * canvasHeight;
                    ctx.beginPath();
                    ctx.arc(randX, randY, 1.2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 200, 150, ${Math.random() * 0.5})`;
                    ctx.fill();
                }
            }
        }
        
        // 核心动画：整合所有力（鼠标斥力 + 粒子间斥力 + 中心引力 + 漩涡）
        function animate() {
            if (!ctx) return;
            
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;
            
            // 临时存储每个粒子的合力
            const forces = new Array(particles.length);
            for (let i = 0; i < particles.length; i++) {
                forces[i] = { fx: 0, fy: 0 };
            }
            
            // 1. 计算粒子间斥力（O(N²)，但粒子数量适中，性能可接受）
            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distSq = dx * dx + dy * dy;
                    if (distSq < INTER_REPULSION_RADIUS * INTER_REPULSION_RADIUS && distSq > 0.01) {
                        const dist = Math.sqrt(distSq);
                        const force = (1 - dist / INTER_REPULSION_RADIUS) * INTER_REPULSION_STRENGTH;
                        const dirX = dx / dist;
                        const dirY = dy / dist;
                        const fx = dirX * force;
                        const fy = dirY * force;
                        forces[i].fx += fx;
                        forces[i].fy += fy;
                        forces[j].fx -= fx;
                        forces[j].fy -= fy;
                    }
                }
            }
            
            // 2. 添加鼠标斥力
            for (let i = 0; i < particles.length; i++) {
                const repel = computeMouseRepulsion(particles[i], mouseX, mouseY);
                forces[i].fx += repel.fx;
                forces[i].fy += repel.fy;
            }
            
            // 3. 添加中心引力
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const dxToCenter = centerX - p.x;
                const dyToCenter = centerY - p.y;
                forces[i].fx += dxToCenter * CENTER_ATTRACTION;
                forces[i].fy += dyToCenter * CENTER_ATTRACTION;
            }
            
            // 4. 添加漩涡力（增加迷幻感）
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const swirlX = Math.sin(p.y * 0.008) * 0.08;
                const swirlY = Math.cos(p.x * 0.008) * 0.08;
                forces[i].fx += swirlX;
                forces[i].fy += swirlY;
            }
            
            // 更新所有粒子
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.update(forces[i].fx, forces[i].fy, canvasWidth, canvasHeight);
                // 色相流动
                p.hue = (p.hue + 0.2) % 360;
                p.lightness = 60 + Math.sin(Date.now() * 0.002 * p.hue) * 12;
            }
            
            // 渲染
            drawBackground();
            drawLines();
            drawGlowBursts();
            drawParticles();
            drawMouseGlow();
            drawMeteorDust();
            
            // 额外的光晕叠加
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < 6; i++) {
                let testIdx = (Date.now() + i * 300) % particles.length;
                let p = particles[testIdx];
                if(p) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 3, 0, Math.PI*2);
                    ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, 0.1)`;
                    ctx.fill();
                }
            }
            ctx.globalCompositeOperation = 'source-over';
            
            const time = Date.now() * 0.002;
            ctx.fillStyle = `rgba(100, 180, 255, 0.03)`;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            animationId = requestAnimationFrame(animate);
        }
        
        function bindEvents() {
            window.addEventListener('resize', () => resizeCanvas());
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseleave', onMouseLeave);
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchstart', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onTouchEnd);
            canvas.addEventListener('touchcancel', onTouchEnd);
        }
        
        function start() {
            resizeCanvas();
            bindEvents();
            animate();
        }
        
        const canvas = document.getElementById('particleCanvas');
        let ctx = canvas.getContext('2d');
        
        window.addEventListener('load', start);
        window.addEventListener('beforeunload', () => {
            if (animationId) cancelAnimationFrame(animationId);
        });
    })();
</script>
</body>
</html>
