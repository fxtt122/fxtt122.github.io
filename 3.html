<script>
    // ===== 智能图片加载系统 (已修复) =====
    // 点击缩略图加载并显示原图
    function loadOriginalImage(thumbElement) {
        const originalSrc = thumbElement.getAttribute('data-src');
        const fullscreenImg = document.getElementById('fullscreenImg');
        const modal = document.getElementById('fullscreenModal');
        
        // 1. 立即显示全屏框，先展示缩略图（即时反馈）
        fullscreenImg.src = thumbElement.src;
        fullscreenImg.alt = thumbElement.alt;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        // 2. 异步加载高清原图
        const originalImage = new Image();
        originalImage.onload = function() {
            // 原图加载完成后，替换全屏显示的图片
            fullscreenImg.src = originalSrc;
        };
        originalImage.onerror = function() {
            console.error('原图加载失败:', originalSrc);
            // 可以保持显示缩略图，或给用户一个提示
        };
        originalImage.src = originalSrc; // 开始加载
    }

    // 关闭全屏查看器
    function closeFullscreen() {
        const modal = document.getElementById('fullscreenModal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    // ESC键关闭全屏
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeFullscreen();
        }
    });

    // 点击模态框背景或关闭按钮时关闭
    document.getElementById('fullscreenModal').addEventListener('click', function(e) {
        if (e.target === this || e.target.classList.contains('close-modal')) {
            closeFullscreen();
        }
    });
</script>
