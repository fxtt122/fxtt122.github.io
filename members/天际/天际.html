<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天际</title>
    <link rel="icon" type="image/png" href="../../favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../../favicon/favicon.svg" />
    <link rel="shortcut icon" href="../../favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../../favicon/site.webmanifest" />
    <style>
        /* 基础重置和变量 */
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --text-color: #333;
            --text-light: #7f8c8d;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
            --transition: all 0.3s ease;
            --max-content-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.7;
            color: var(--text-color);
            background-color: #f9f9f9;
            overflow-x: hidden;
        }

        /* 容器系统 */
        .container {
            width: 100%;
            padding: 0 5vw;
            margin: 0 auto;
        }

        /* 头部样式 */
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem 0;
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
        }

        .content-section {
            padding: 2rem 0;
        }

        /* 标题样式 - 仅保留页面实际用到的 h1 */
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--secondary-color);
            font-size: 2rem;
        }

        .back-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--primary-color);
            color: white;
            border-radius: var(--border-radius);
            text-decoration: none;
            transition: var(--transition);
            font-weight: 600;
        }

        .back-link:hover {
            background: var(--accent-color);
            text-decoration: none;
            color: white;
            transform: translateY(-2px);
        }

        /* 信息板块 - 原 update-day 重命名 */
        .info {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            padding: 1.5rem;
            transition: var(--transition);
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .info h1,
        .info h3 {
            margin: 0;
        }
        .info h1 {
            text-align: left;
        }

        .info p {
            flex: 0 0 100%;
            margin: 0;
        }

        /* 页脚 */
        .footer {
            background-color: var(--secondary-color);
            color: white;
            padding: 2rem 0;
            text-align: center;
            margin-top: 2rem;
        }

        .footer p {
            margin-top: 1rem;
            color: var(--light-color);
        }

        /* 深色模式支持 */
        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #e0e0e0;
                --light-color: #1a1a1a;
                --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            }

            body {
                background-color: #121212;
            }

            .info {
                background-color: #2d2d2d;
            }

            .footer p {
               color: var(--text-color);
            }

            h1 {
                color: #e0e0e0;
            }
        }

        /* 平板设备优化 */
        @media (min-width: 768px) {
            .container {
                max-width: 720px;
            }
        }

        /* 桌面设备优化 */
        @media (min-width: 992px) {
            .container {
                max-width: 960px;
            }
        }

        /* 大屏幕优化 */
        @media (min-width: 1200px) {
            .container {
                max-width: var(--max-content-width);
            }
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }

            html {
                scroll-behavior: auto;
            }
            
            .info:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">天际的个人主页</div>
        </div>
    </header>

    <main class="container">
        <section class="content-section">
            <div class="back-row">
                <a href="../../ranking.html" class="back-link">← 返回</a>
            </div>

            <div class="info">
                <h1>天际</h1><h3>Horizon</h3>
                <p><strong>笔名出处：</strong>独自起的笔名，英文笔名为 Horizon 。</p>
                <p><strong>签名：</strong>系统原装签名，联系场主以修改。</p>
                <p><strong>姓名：</strong>任**</p>
                <p><strong>性别：</strong>男</p>
                <p><strong>注册地点：</strong>（一个没命名的区，就暂时叫“公司”吧）</p>
                <p><strong>场主的说明/评价：</strong>最近你犯大事了！</p>
            </div>
            <p>个人主页不好看？你可以把自己做的主页发给场主，通过审核后可以在这里展示！</p>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>无名剧场网页服务系统</p>
            <p>© 2025 追光系列. 保留所有权利.</p>
        </div>
    </footer>
</body>
</html>
