<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动</title>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <style>
        :root {
            --primary-color: #5b9bd5;
            --primary-glow: #7ec8f8;
            --secondary-color: #2c3e50;
            --accent-color: #e07060;
            --accent-glow: #f0a090;
            --light-color: #ecf0f1;
            --dark-color: #1a1d2e;
            --text-color: #2c2c2c;
            --text-light: #6b7280;
            --glass-bg-light: rgba(255, 255, 255, 0.55);
            --glass-bg-dark: rgba(20, 22, 30, 0.7);
            --glass-border-light: rgba(255, 255, 255, 0.55);
            --glass-border-dark: rgba(255, 255, 255, 0.08);
            --glass-blur: 18px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.10);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.14);
            --shadow-glow: 0 0 40px rgba(91, 155, 213, 0.18);
            --border-radius-sm: 10px;
            --border-radius: 16px;
            --border-radius-lg: 20px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --max-content-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.7;
            color: var(--text-color);
            background:
                radial-gradient(ellipse 80% 60% at 15% 25%, rgba(91, 155, 213, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse 70% 55% at 78% 18%, rgba(224, 112, 96, 0.16) 0%, transparent 55%),
                radial-gradient(ellipse 65% 50% at 50% 70%, rgba(126, 200, 248, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 45% at 85% 75%, rgba(240, 160, 144, 0.13) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 25% 85%, rgba(91, 155, 213, 0.15) 0%, transparent 55%),
                linear-gradient(175deg, #f0f4f8 0%, #e8edf3 25%, #f5f6fa 50%, #eef1f6 75%, #f2f5f9 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 容器系统 */
        .container {
            width: 100%;
            padding: 0 5vw;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header - 液态玻璃 */
        .header {
            background: linear-gradient(160deg,
                    rgba(91, 155, 213, 0.78) 0%,
                    rgba(68, 120, 175, 0.82) 40%,
                    rgba(44, 62, 80, 0.86) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 1.6rem 0;
            box-shadow: 0 6px 28px rgba(44, 62, 80, 0.25);
            position: relative;
            z-index: 100;
            transition: var(--transition);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.5) 30%,
                    rgba(255, 255, 255, 0.7) 50%,
                    rgba(255, 255, 255, 0.5) 70%,
                    transparent 100%);
            pointer-events: none;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }

        /* 内容区域 */
        .content-section {
            padding: 2.5rem 0;
        }

        h2 {
            margin: 1.8rem 0 1.2rem;
            color: var(--secondary-color);
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, var(--primary-color), transparent) 1;
            padding-bottom: 0.6rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        h3 {
            margin: 1.4rem 0 0.9rem;
            color: var(--secondary-color);
            font-size: 1.3rem;
            font-weight: 700;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
        }

        a:hover {
            color: #3a7ec8;
            text-decoration: none;
        }

        a::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--primary-color);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        a:hover::after {
            width: 100%;
        }

        /* 返回链接 */
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.6rem 1.2rem;
            background: var(--glass-bg-light);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border-light);
            color: var(--secondary-color);
            border-radius: 30px;
            text-decoration: none;
            transition: var(--transition);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.68);
            box-shadow: var(--shadow-md);
            color: var(--primary-color);
            text-decoration: none;
            transform: translateY(-2px);
        }

        .back-link::after {
            display: none;
        }

        /* 活动卡片 - 液态玻璃 */
        .activity-card {
            background: var(--glass-bg-light);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border-light);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .activity-card::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -20%;
            width: 60%;
            height: 180%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.25) 0%, transparent 70%);
            transform: rotate(-15deg);
            pointer-events: none;
            transition: var(--transition);
            opacity: 0;
        }

        .activity-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.68);
        }

        .activity-card:hover::before {
            opacity: 1;
            top: -30%;
            left: -10%;
        }

        .activity-card h3 {
            color: var(--primary-color);
            border-bottom: 1px solid rgba(91, 155, 213, 0.2);
            padding-bottom: 0.5rem;
            margin-top: 0;
            font-weight: 700;
        }

        .activity-card p {
            margin-top: 0.8rem;
            line-height: 1.6;
        }

        .footer {
            background: linear-gradient(180deg,
                    rgba(44, 62, 80, 0.9) 0%,
                    rgba(26, 29, 46, 0.94) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 2.5rem 0;
            text-align: center;
            margin-top: 3rem;
            position: relative;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.3) 40%,
                    rgba(255, 255, 255, 0.5) 50%,
                    rgba(255, 255, 255, 0.3) 60%,
                    transparent 100%);
            pointer-events: none;
        }

        .footer p {
            margin-top: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        .footer p:first-child {
            font-weight: 600;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        /* 脉冲装饰点 */
        .pulse-dot {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseFloat 8s ease-in-out infinite;
        }

        @keyframes pulseFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.45;
            }
            25% {
                transform: translate(15px, -20px) scale(1.3);
                opacity: 0.7;
            }
            50% {
                transform: translate(-8px, -35px) scale(0.9);
                opacity: 0.35;
            }
            75% {
                transform: translate(-18px, -10px) scale(1.2);
                opacity: 0.6;
            }
        }

        /* =============== 响应式设计 =============== */
        @media (min-width: 768px) {
            .container {
                max-width: 720px;
            }

            .activity-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }

            .activity-grid .activity-card {
                margin-bottom: 0;
            }
        }

        @media (min-width: 992px) {
            .container {
                max-width: 960px;
            }

            .activity-grid {
                gap: 1.8rem;
            }
        }

        @media (min-width: 1200px) {
            .container {
                max-width: var(--max-content-width);
            }

            .activity-grid {
                gap: 2rem;
            }
        }

        /* =============== 深色模式 =============== */
        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #e0e0e0;
                --light-color: #1a1a1a;
                --secondary-color: #d0d6e0;
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
                --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.4);
                --shadow-glow: 0 0 40px rgba(126, 200, 248, 0.12);
            }

            body {
                background:
                    radial-gradient(ellipse 80% 60% at 15% 25%, rgba(91, 155, 213, 0.10) 0%, transparent 55%),
                    radial-gradient(ellipse 70% 55% at 78% 18%, rgba(224, 112, 96, 0.08) 0%, transparent 55%),
                    radial-gradient(ellipse 65% 50% at 50% 70%, rgba(126, 200, 248, 0.09) 0%, transparent 55%),
                    radial-gradient(ellipse 60% 45% at 85% 75%, rgba(240, 160, 144, 0.06) 0%, transparent 55%),
                    radial-gradient(ellipse 50% 40% at 25% 85%, rgba(91, 155, 213, 0.07) 0%, transparent 55%),
                    linear-gradient(175deg, #14161e 0%, #181a24 25%, #15171f 50%, #191c26 75%, #161820 100%);
            }

            .activity-card {
                background: rgba(24, 27, 34, 0.72);
                border-color: rgba(255, 255, 255, 0.07);
            }

            .activity-card:hover {
                background: rgba(30, 34, 42, 0.78);
                border-color: rgba(255, 255, 255, 0.16);
                box-shadow: var(--shadow-lg), 0 0 50px rgba(126, 200, 248, 0.1);
            }

            .activity-card::before {
                background: radial-gradient(ellipse, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            }

            .activity-card h3 {
                color: #7ec8f8;
                border-bottom-color: rgba(126, 200, 248, 0.2);
            }

            h2 {
                color: #d8dde4;
            }

            .back-link {
                background: rgba(24, 27, 34, 0.72);
                border-color: rgba(255, 255, 255, 0.07);
                color: #d0d6e0;
            }

            .back-link:hover {
                background: rgba(30, 34, 42, 0.78);
                border-color: rgba(255, 255, 255, 0.16);
                color: #7ec8f8;
            }

            .footer p {
                color: rgba(255, 255, 255, 0.7);
            }

            .footer p:first-child {
                color: rgba(255, 255, 255, 0.85);
            }

            .header {
                background: linear-gradient(160deg,
                        rgba(55, 95, 135, 0.82) 0%,
                        rgba(40, 70, 105, 0.85) 40%,
                        rgba(20, 30, 45, 0.9) 100%);
                border-bottom-color: rgba(255, 255, 255, 0.12);
                box-shadow: 0 6px 28px rgba(0, 0, 0, 0.4);
            }

            .header::after {
                background: linear-gradient(90deg,
                        transparent 0%,
                        rgba(255, 255, 255, 0.2) 30%,
                        rgba(255, 255, 255, 0.35) 50%,
                        rgba(255, 255, 255, 0.2) 70%,
                        transparent 100%);
            }

            .footer {
                background: linear-gradient(180deg,
                        rgba(20, 25, 35, 0.92) 0%,
                        rgba(14, 17, 24, 0.96) 100%);
                border-top-color: rgba(255, 255, 255, 0.08);
            }
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }

            html {
                scroll-behavior: auto;
            }

            .activity-card:hover {
                transform: none;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) {
            .activity-card:hover {
                transform: none;
            }

            .activity-card::before {
                display: none;
            }

            .back-link:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>

    <!-- 背景装饰光斑 -->
    <div class="pulse-dot" style="top:12%;left:8%;width:180px;height:180px;background:radial-gradient(circle,rgba(126,200,248,0.35) 0%,transparent 70%);animation-delay:0s;"></div>
    <div class="pulse-dot" style="top:55%;right:6%;width:220px;height:220px;background:radial-gradient(circle,rgba(240,160,144,0.28) 0%,transparent 70%);animation-delay:-3s;"></div>
    <div class="pulse-dot" style="top:75%;left:12%;width:160px;height:160px;background:radial-gradient(circle,rgba(126,200,248,0.3) 0%,transparent 70%);animation-delay:-5.5s;"></div>
    <div class="pulse-dot" style="top:20%;right:15%;width:140px;height:140px;background:radial-gradient(circle,rgba(180,210,240,0.25) 0%,transparent 70%);animation-delay:-2s;"></div>
    <div class="pulse-dot" style="top:88%;right:20%;width:200px;height:200px;background:radial-gradient(circle,rgba(200,180,220,0.22) 0%,transparent 70%);animation-delay:-6s;"></div>

    <header class="header">
        <div class="container">
            <div class="logo">活动</div>
        </div>
    </header>

    <main class="container">
        <section class="content-section">
            <a href="index.html" class="back-link">← 返回首页</a>
            <h2>当前活动</h2>
            <div class="activity-card">
                <p>暂无进行中的活动</p>
                <p>敬请期待更多精彩活动！</p>
            </div>

            <h2>往期活动</h2>
            <div class="activity-grid">
                <div class="activity-card">
                    <h3>2024年5月1日~2024年5月31日</h3>
                    <p>无名剧场搞五一活动啦！5月1日至5月31日无名剧场前十名可免费获取iOS付费软件（任何价格）！应用数量有限，先到先得！</p>
                </div>

                <!-- 可以添加更多往期活动卡片 -->
                <!--
                <div class="activity-card">
                    <h3>活动标题</h3>
                    <p>活动描述内容...</p>
                </div>
                -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>无名剧场网页服务系统</p>
            <p>© 2025-2026 追光系列. 保留所有权利.</p>
        </div>
    </footer>
</body>
</html>
