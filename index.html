<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无名剧场网页服务系统</title>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <style>
        :root {
            --primary-color: #5b9bd5;
            --primary-glow: #7ec8f8;
            --secondary-color: #2c3e50;
            --text-color: #2c2c2c;
            --max-content-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.7;
            color: var(--text-color);
            background:
                radial-gradient(ellipse 80% 60% at 15% 25%, rgba(91, 155, 213, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse 70% 55% at 78% 18%, rgba(224, 112, 96, 0.16) 0%, transparent 55%),
                radial-gradient(ellipse 65% 50% at 50% 70%, rgba(126, 200, 248, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 45% at 85% 75%, rgba(240, 160, 144, 0.13) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 25% 85%, rgba(91, 155, 213, 0.15) 0%, transparent 55%),
                linear-gradient(175deg, #f0f4f8 0%, #e8edf3 25%, #f5f6fa 50%, #eef1f6 75%, #f2f5f9 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            padding: 0 5vw;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(160deg,
                    rgba(91, 155, 213, 0.78) 0%,
                    rgba(68, 120, 175, 0.82) 40%,
                    rgba(44, 62, 80, 0.86) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 1.6rem 0;
            box-shadow: 0 6px 28px rgba(44, 62, 80, 0.25);
            position: relative;
            z-index: 100;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.5) 30%,
                    rgba(255, 255, 255, 0.7) 50%,
                    rgba(255, 255, 255, 0.5) 70%,
                    transparent 100%);
            pointer-events: none;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }

        .content-section {
            padding: 2.5rem 0;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.8rem;
            color: var(--secondary-color);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            position: relative;
        }

        h1::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-glow), var(--primary-color));
            border-radius: 3px;
            margin: 0.7rem auto 0;
            opacity: 0.8;
        }

        .pulse-dot {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseFloat 8s ease-in-out infinite;
        }

        @keyframes pulseFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.45;
            }
            25% {
                transform: translate(15px, -20px) scale(1.3);
                opacity: 0.7;
            }
            50% {
                transform: translate(-8px, -35px) scale(0.9);
                opacity: 0.35;
            }
            75% {
                transform: translate(-18px, -10px) scale(1.2);
                opacity: 0.6;
            }
        }

        .footer {
            background: linear-gradient(180deg,
                    rgba(44, 62, 80, 0.9) 0%,
                    rgba(26, 29, 46, 0.94) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 2.5rem 0;
            text-align: center;
            margin-top: 3rem;
            position: relative;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.3) 40%,
                    rgba(255, 255, 255, 0.5) 50%,
                    rgba(255, 255, 255, 0.3) 60%,
                    transparent 100%);
            pointer-events: none;
        }

        .footer p {
            margin-top: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        .footer p:first-child {
            font-weight: 600;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
        }

        @media (min-width: 768px) {
            .container {
                max-width: 720px;
            }
        }

        @media (min-width: 992px) {
            .container {
                max-width: 960px;
            }
        }

        @media (min-width: 1200px) {
            .container {
                max-width: var(--max-content-width);
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-color: #e0e0e0;
                --secondary-color: #d0d6e0;
            }

            body {
                background:
                    radial-gradient(ellipse 80% 60% at 15% 25%, rgba(91, 155, 213, 0.10) 0%, transparent 55%),
                    radial-gradient(ellipse 70% 55% at 78% 18%, rgba(224, 112, 96, 0.08) 0%, transparent 55%),
                    radial-gradient(ellipse 65% 50% at 50% 70%, rgba(126, 200, 248, 0.09) 0%, transparent 55%),
                    radial-gradient(ellipse 60% 45% at 85% 75%, rgba(240, 160, 144, 0.06) 0%, transparent 55%),
                    radial-gradient(ellipse 50% 40% at 25% 85%, rgba(91, 155, 213, 0.07) 0%, transparent 55%),
                    linear-gradient(175deg, #14161e 0%, #181a24 25%, #15171f 50%, #191c26 75%, #161820 100%);
            }

            h1 {
                color: #d8dde4;
            }

            h1::after {
                background: linear-gradient(90deg, #5b9bd5, #7ec8f8, #5b9bd5);
            }

            .header {
                background: linear-gradient(160deg,
                        rgba(55, 95, 135, 0.82) 0%,
                        rgba(40, 70, 105, 0.85) 40%,
                        rgba(20, 30, 45, 0.9) 100%);
                border-bottom-color: rgba(255, 255, 255, 0.12);
                box-shadow: 0 6px 28px rgba(0, 0, 0, 0.4);
            }

            .header::after {
                background: linear-gradient(90deg,
                        transparent 0%,
                        rgba(255, 255, 255, 0.2) 30%,
                        rgba(255, 255, 255, 0.35) 50%,
                        rgba(255, 255, 255, 0.2) 70%,
                        transparent 100%);
            }

            .footer {
                background: linear-gradient(180deg,
                        rgba(20, 25, 35, 0.92) 0%,
                        rgba(14, 17, 24, 0.96) 100%);
                border-top-color: rgba(255, 255, 255, 0.08);
            }

            .footer p {
                color: rgba(255, 255, 255, 0.7);
            }

            .footer p:first-child {
                color: rgba(255, 255, 255, 0.85);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .pulse-dot {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <!-- 主页背景装饰光斑 -->
    <div class="pulse-dot" style="top:12%;left:8%;width:180px;height:180px;background:radial-gradient(circle,rgba(126,200,248,0.35) 0%,transparent 70%);animation-delay:0s;"></div>
    <div class="pulse-dot" style="top:55%;right:6%;width:220px;height:220px;background:radial-gradient(circle,rgba(240,160,144,0.28) 0%,transparent 70%);animation-delay:-3s;"></div>
    <div class="pulse-dot" style="top:75%;left:12%;width:160px;height:160px;background:radial-gradient(circle,rgba(126,200,248,0.3) 0%,transparent 70%);animation-delay:-5.5s;"></div>
    <div class="pulse-dot" style="top:20%;right:15%;width:140px;height:140px;background:radial-gradient(circle,rgba(180,210,240,0.25) 0%,transparent 70%);animation-delay:-2s;"></div>
    <div class="pulse-dot" style="top:88%;right:20%;width:200px;height:200px;background:radial-gradient(circle,rgba(200,180,220,0.22) 0%,transparent 70%);animation-delay:-6s;"></div>

    <!-- 主页Header -->
    <header class="header">
        <div class="container">
            <div class="logo">无名剧场网页服务系统</div>
        </div>
    </header>

    <!-- 主页内容 -->
    <main class="container">
        <section class="content-section">
            <h1>无法连接到追光系列总服务器！</h1>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>无名剧场网页服务系统</p>
            <p>© 2025-2026 追光系列. 保留所有权利.</p>
        </div>
    </footer>

</body>
</html>
